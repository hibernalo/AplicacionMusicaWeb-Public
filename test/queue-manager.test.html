<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test QueueManager</title>
</head>
<body>
    <h1>QueueManager — resultados</h1>
    <pre id="out"></pre>
    <script type="module">
        // Limpiar estado previo antes de importar (el constructor llama a restore())
        localStorage.removeItem('musicQueue');
        const queueManager = (await import('../js/queue-manager.js')).default;

        const out = document.getElementById('out');
        let passed = 0, failed = 0;
        function assert(cond, msg) {
            if (cond) { passed++; out.textContent += `PASS: ${msg}\n`; }
            else { failed++; out.textContent += `FAIL: ${msg}\n`; }
        }
        const ids = q => q.map(s => s.id).join(',');

        // add() es LIFO
        queueManager.clear();
        queueManager.add({ id: 'A', title: 'A' });
        queueManager.add({ id: 'B', title: 'B' });
        queueManager.add({ id: 'C', title: 'C' });
        assert(ids(queueManager.getQueue()) === 'C,B,A', 'add() inserta al principio (LIFO)');

        // add() duplicado mueve al frente
        queueManager.add({ id: 'A', title: 'A' });
        assert(ids(queueManager.getQueue()) === 'A,C,B', 'add() duplicado mueve al frente');

        // takeNext() saca el primero
        const first = queueManager.takeNext();
        assert(first.id === 'A', 'takeNext() devuelve el primero');
        assert(ids(queueManager.getQueue()) === 'C,B', 'takeNext() quita el primero');

        // jumpTo() descarta la objetivo y las anteriores
        queueManager.clear();
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'D' }); // cola: [D, C, A, B]
        const jumped = queueManager.jumpTo('A');
        assert(jumped.id === 'A', 'jumpTo() devuelve la objetivo');
        assert(ids(queueManager.getQueue()) === 'B', 'jumpTo() descarta objetivo + anteriores, deja el resto');
        assert(ids(JSON.parse(localStorage.getItem('musicQueue'))) === 'B', 'jumpTo() persiste el cambio en localStorage');

        // remove() quita una concreta
        queueManager.clear();
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'D' }); // cola: [D, C, A, B]
        queueManager.remove('C');
        assert(ids(queueManager.getQueue()) === 'D,A,B', 'remove() quita la canción indicada');
        assert(ids(JSON.parse(localStorage.getItem('musicQueue'))) === 'D,A,B', 'remove() persiste el cambio en localStorage');

        // clear() vacía
        queueManager.clear();
        assert(queueManager.isEmpty(), 'clear() vacía la cola');

        // persistencia: persist + nueva lectura de localStorage
        queueManager.add({ id: 'X', title: 'X' });
        const stored = JSON.parse(localStorage.getItem('musicQueue'));
        assert(stored.length === 1 && stored[0].id === 'X', 'persist() guarda en localStorage');

        // move() — mover hacia abajo: [A,B,C,D] → move(0,2) → [B,C,A,D]
        queueManager.clear();
        queueManager.add({ id: 'D' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' }); // cola: [A,B,C,D]
        assert(ids(queueManager.getQueue()) === 'A,B,C,D', 'move() setup: cola inicial [A,B,C,D]');
        queueManager.move(0, 2);
        assert(ids(queueManager.getQueue()) === 'B,C,A,D', 'move() mover hacia abajo: move(0,2) → [B,C,A,D]');

        // move() — mover hacia arriba: [A,B,C,D] → move(3,0) → [D,A,B,C]
        queueManager.clear();
        queueManager.add({ id: 'D' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' }); // cola: [A,B,C,D]
        queueManager.move(3, 0);
        assert(ids(queueManager.getQueue()) === 'D,A,B,C', 'move() mover hacia arriba: move(3,0) → [D,A,B,C]');

        // move() — no-op: move(1,1) no cambia nada
        queueManager.clear();
        queueManager.add({ id: 'D' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' }); // cola: [A,B,C,D]
        queueManager.move(1, 1);
        assert(ids(queueManager.getQueue()) === 'A,B,C,D', 'move() no-op: move(1,1) no cambia el orden');

        // move() — fuera de rango: move(0,99) no cambia nada
        queueManager.clear();
        queueManager.add({ id: 'D' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' }); // cola: [A,B,C,D]
        queueManager.move(0, 99);
        assert(ids(queueManager.getQueue()) === 'A,B,C,D', 'move() fuera de rango: move(0,99) no cambia el orden');

        // move() — persistencia: localStorage refleja el nuevo orden
        queueManager.clear();
        queueManager.add({ id: 'D' });
        queueManager.add({ id: 'C' });
        queueManager.add({ id: 'B' });
        queueManager.add({ id: 'A' }); // cola: [A,B,C,D]
        queueManager.move(0, 2);
        const storedMove = JSON.parse(localStorage.getItem('musicQueue'));
        assert(ids(storedMove) === 'B,C,A,D', 'move() persiste el nuevo orden en localStorage');

        out.textContent += `\nTOTAL: ${passed} passed, ${failed} failed\n`;
        document.title = failed === 0 ? 'TEST OK' : 'TEST FAIL';
    </script>
</body>
</html>
